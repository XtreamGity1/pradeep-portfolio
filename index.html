<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pradeep Vangoori — Video &amp; Content Editor for YouTube, Shorts &amp; Podcasts</title>
    <meta name="description" content="Pradeep Vangoori is a video and content editor for YouTube creators, short-form and podcasts. Watch his edits, before-and-after breakdowns and editing packages." />
    <meta name="author" content="Pradeep Vangoori" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />
    <!-- __SITE_URL__ is the production URL, filled in at build time (see vite.config.js). -->
    <link rel="canonical" href="__SITE_URL__" />

    <!-- Open Graph / Twitter cards. Share image: public/og-image.jpg (1200×630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pradeep Vangoori" />
    <meta property="og:title" content="Pradeep Vangoori — Video &amp; Content Editor" />
    <meta property="og:description" content="Edits for YouTube creators, shorts and podcasts. See the work, the before-and-afters and how to book an edit." />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="__SITE_URL__og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pradeep Vangoori, video and content editor for YouTube, Shorts and podcasts" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pradeep Vangoori — Video &amp; Content Editor" />
    <meta name="twitter:description" content="Edits for YouTube creators, shorts and podcasts. See the work, the before-and-afters and how to book an edit." />
    <meta name="twitter:image" content="__SITE_URL__og-image.jpg" />
    <meta name="twitter:image:alt" content="Pradeep Vangoori, video and content editor for YouTube, Shorts and podcasts" />

    <!-- Structured data; keep in sync with `profile` in src/data.js. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Pradeep Vangoori",
        "jobTitle": "Content editor",
        "email": "mailto:hello.pradeepvideo@gmail.com",
        "url": "__SITE_URL__",
        "homeLocation": { "@type": "Place", "name": "Nalgonda, Telangana, India" },
        "knowsAbout": ["Video editing", "YouTube videos", "Short-form video", "Podcast editing"]
      }
    </script>

    <!-- The hero's first frame is the largest thing above the fold: fetch it first. -->
    <link rel="preload" as="image" type="image/webp" href="/media/hero-poster.webp" fetchpriority="high" />

    <!-- Self-hosted fonts (@font-face in src/index.css): preload the two the hero headline uses. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-tight-latin-wght.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-serif-latin-italic.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
