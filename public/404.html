<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />
    <title>Page not found — Pradeep Vangoori</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Standalone page served by Vercel for unknown paths; colours match the @theme tokens in src/index.css. -->
    <style>
      /* The site's self-hosted fonts (Latin subset; see src/index.css). */
      @font-face {
        font-family: 'Inter Tight'; font-style: normal; font-weight: 100 900; font-display: swap;
        src: url('/fonts/inter-tight-latin-wght.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; font-display: swap;
        src: url('/fonts/instrument-serif-latin-italic.woff2') format('woff2');
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100svh; display: grid; place-items: center; padding: 1.5rem;
        background: #0a0a0c; color: #f4f4f6; text-align: center;
        font-family: 'Inter Tight', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      }
      p.code { font-size: .75rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #ff4d6d; }
      h1 { margin-top: 1rem; font-size: clamp(2.25rem, 8vw, 4rem); font-weight: 600; letter-spacing: -.03em; line-height: 1.05; }
      h1 em { font-family: 'Instrument Serif', ui-serif, Georgia, serif; font-weight: 400; color: #9a9aa6; }
      p.lede { margin: 1.25rem auto 0; max-width: 28rem; color: #9a9aa6; line-height: 1.6; }
      a {
        display: inline-flex; align-items: center; gap: .5rem; margin-top: 2.5rem; min-height: 3rem; padding: 0 1.75rem;
        border-radius: 9999px; background: #f4f4f6; color: #0a0a0c; font-weight: 600; text-decoration: none; transition: background-color .3s;
      }
      a:hover { background: #ff4d6d; }
      a:focus-visible { outline: 2px solid #ff4d6d; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This cut didn’t <em>make the edit.</em></h1>
      <p class="lede">The page you’re looking for doesn’t exist or has moved.</p>
      <a href="/">Back to the home page <span aria-hidden="true">&rarr;</span></a>
    </main>
  </body>
</html>
